</section><dialog id="modal"></dialog><footer>慢慢想，動手數，每一步都是小進步。<span>離線 HTML 版 · 無倒數 · 無需學生姓名</span></footer><script>const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');
const games=[

['split','🦋','蝴蝶分兩家','把蝴蝶分成兩群，完成數的合成。','數的合成','#f3e6ec'],

['missing','🎁','神秘禮物盒','找出禮物盒裏藏着的加數。','數的合成','#f7ecd9'],

];
let stage=new URLSearchParams(location.search).get('stage')==='2'?2:1,filter='全部',sound=false,settings={rounds:5,choices:3,range:0,extension:false},records=[];
try{Object.assign(settings,JSON.parse(localStorage.getItem('gardenSettings')||'{}'));records=JSON.parse(localStorage.getItem('gardenRecords')||'[]')}catch{}
let active=null,q=null,index=0,first=0,helped=0,mistakes=0,done=false,usedHelp=false,hadError=false,work=0,step=0,marks=new Set();

const garden=`<svg class="garden" viewBox="0 0 420 255" aria-hidden="true"><ellipse cx="215" cy="227" rx="181" ry="17" fill="#d4dfc4"/><path d="M155 223v-96m0 44-30-21m30 1 32-25" stroke="#5c7b48" stroke-width="8" fill="none"/><circle cx="131" cy="105" r="43" fill="#8dab72"/><circle cx="178" cy="98" r="44" fill="#8dab72"/><circle cx="156" cy="65" r="39" fill="#9bb983"/><circle cx="123" cy="99" r="10" fill="#e7a25c"/><circle cx="179" cy="69" r="10" fill="#f1bb79"/><circle cx="177" cy="121" r="10" fill="#e7a25c"/><path d="M236 179h104l-15 47h-74z" fill="#c58d64"/><path d="M248 178v-42m38 42v-60m39 60v-35" stroke="#779b58" stroke-width="5"/><g fill="#efd28e"><circle cx="248" cy="124" r="20"/><circle cx="286" cy="105" r="24"/><circle cx="325" cy="132" r="19"/></g><g fill="#bc854b"><circle cx="248" cy="124" r="8"/><circle cx="286" cy="105" r="9"/><circle cx="325" cy="132" r="8"/></g><rect x="51" y="166" width="62" height="49" rx="10" fill="#faf9ef" transform="rotate(-9 51 166)"/><text x="64" y="199" font-size="26" fill="#547245" transform="rotate(-9 51 166)">2+3</text><circle cx="351" cy="48" r="24" fill="#f2d89a"/><path d="m366 192 7-23 7 23" stroke="#97ad77" stroke-width="5" fill="none"/></svg>`;
function speak(t){if(!sound||!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.8;speechSynthesis.speak(u)}

function home(){active=null;filter=filter==='延伸減法'&&!settings.extension?'全部':filter;const visible=games.filter(g=>(settings.extension||g[4]!=='延伸減法')&&(filter==='全部'||g[4]===filter));app.innerHTML=`<section class="hero"><div><div class="eyebrow">LET’S GROW TOGETHER</div><h1>小小數學家，<br>今天想玩哪一個？</h1><p>數一數、合起來，一起發現數字的樂趣。<br>選一個遊戲，種下今天的小成就。</p><div class="hero-tags"><span class="pill">✧ 一次一小步</span><span class="pill">☘ 每次 ${settings.rounds} 題</span><span class="pill">♡ 慢慢來，沒關係</span></div></div>${garden}</section><section><div class="section-top"><div><h2>探索遊戲小花園 <span class="subtle">${visible.length} 款遊戲</span></h2><p>${stage===1?'階段 1 · 10 以內加法與數的合成':'階段 2 · 18 以內加法、11–18 的合成與順數'}${settings.range?' · 已自訂至 '+settings.range+' 以內':''}</p></div><div class="stages"><button data-stage="1" class="${stage===1?'selected':''}">🌱 階段 1</button><button data-stage="2" class="${stage===2?'selected':''}">🌳 階段 2</button></div></div><div class="filters">${['全部','數感暖身','加法樂園','數的合成','順數策略',...(settings.extension?['延伸減法']:[])].map(c=>`<button class="${filter===c?'selected':''}" data-filter="${c}">${c}</button>`).join('')}</div><div class="grid">${visible.map(g=>`<button class="card" data-game="${g[0]}" style="--tint:${g[5]}"><div class="card-top"><span class="tile">${g[1]}</span><span class="tag">${g[4]}</span></div><h3>${g[2]}</h3><p>${g[3]}</p><div class="card-bottom"><span>${g[0]==='ten'?'湊成 10':(g[4]==='數感暖身'?'數字探索':limit()+' 以內練習')}</span><span>開始玩 →</span></div></button>`).join('')}</div><div class="note">🌿 給老師的小提示：先以「動物合起來」操作圖像，再玩「算式開花」。階段 2 可加入「青蛙順數跳」。每題可重試，也可按「給我提示」。教師設定可調整題數、選項及開啟延伸減法。</div></section>`;app.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=+b.dataset.stage;settings.range=0;save();try{history.replaceState(null,'','?stage='+stage)}catch{};home()});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home()});app.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game))}
function start(id){active=games.find(g=>g[0]===id);index=0;first=0;helped=0;mistakes=0;next()}
function make(id){const max=limit();let a,b,total;if(stage===2&&max>=11&&['bond','split','missing'].includes(id)){total=rand(11,max);a=rand(Math.max(1,total-9),9);b=total-a}else{a=rand(1,max-1);b=rand(1,max-a);total=a+b}let n=rand(1,max),ans=total,prompt='',mode='choice',visual='add';switch(id){case'count':ans=n;prompt='有多少個蘋果？點一下，數一數。';visual='count';break;case'build':ans=n;prompt=`請放入 ${n} 根蘿蔔。`;mode='build';visual='build';break;case'compare':a=rand(1,max);do{b=rand(1,max)}while(a===b);ans=a>b?'左邊':'右邊';prompt='哪一邊的小魚較多？';visual='compare';break;case'sequence':a=rand(1,max-2);ans=a+1;prompt='找出不見了的數字。';visual='sequence';break;case'merge':prompt='兩群小豬合起來，一共有多少隻？';break;case'draw':prompt='先按兩邊的「加一個圈」，再算出總數。';mode='draw';visual='draw';break;case'equation':prompt='算一算，答案是多少？';visual='none';break;case'story':prompt=`籃子原有 ${a} 個蘋果，再放入 ${b} 個。現在共有多少個？`;break;case'symbols':ans='＋';prompt='兩群合起來，應該用哪個符號？';visual='symbols';break;case'sentence':ans=`${a}＋${b}＝${total}`;prompt='哪一道算式表示這兩群合起來？';break;case'bond':case'missing':ans=b;prompt=id==='bond'?`合起來是 ${total}，另一位朋友是多少？`:'盒子裏藏着多少？';visual='missing';break;case'ten':a=rand(1,9);b=10-a;total=10;ans=b;prompt='再放多少個，便能填滿十格？';visual='ten';break;case'split':ans=b;prompt=`共有 ${total} 隻蝴蝶，左邊有 ${a} 隻。右邊有多少隻？`;visual='split';break;case'counton':prompt=`由 ${a} 開始，向前跳 ${b} 步。最後是多少？`;mode='jump';visual='line';break;case'line':prompt=`由 ${a} 開始，向前 ${b} 步。點選終點。`;mode='line';visual='line';break;case'take':case'sub':a=rand(2,max);b=rand(1,a);total=a-b;ans=total;prompt=id==='take'?`原有 ${a} 塊餅乾，請點走 ${b} 塊。還有多少塊？`:'算一算，還剩下多少？';visual=id==='take'?'take':'none';break;}return{id,a,b,total,n,ans,prompt,mode,visual}}

function dots(n,emoji,cls=''){return `<div class="group ${cls}">${Array.from({length:n},(_,i)=>`<button class="counter" data-dot="${i}" aria-label="第${i+1}個${emoji}">${emoji}</button>`).join('')}</div>`}
function staticDots(n,emoji,cls=''){return `<div class="group ${cls}">${Array.from({length:n},()=>`<span class="counter">${emoji}</span>`).join('')}</div>`}
function visual(){switch(q.visual){case'count':return dots(q.n,'🍎');case'compare':return `<div><p>左邊</p>${staticDots(q.a,'🐟')}</div><div><p>右邊</p>${staticDots(q.b,'🐟','blue')}</div>`;case'build':return `<div><div class="group" id="workArea">${'🥕'.repeat(work)||'籃子是空的'}</div><p>已放入 <b id="workNum">${work}</b> 根</p><button data-act="minus">− 拿走一根</button> <button data-act="plus">＋ 放入一根</button></div>`;case'sequence':return `<div class="math">🚂 ${q.a} → □ → ${q.a+2}</div>`;case'add':return `${staticDots(q.a,q.id==='story'?'🍎':'🐷')}<span class="operator">＋</span>${staticDots(q.b,q.id==='story'?'🍎':'🐷','blue')}`;case'symbols':return `${staticDots(q.a,'🌼')}<span class="operator">？</span>${staticDots(q.b,'🌼','blue')}`;case'missing':return `${staticDots(q.a,'🟠')}<span class="operator">＋</span><div class="group blue" style="font-size:50px">🎁</div>`;case'split':return `${staticDots(q.a,'🦋')}<span class="operator">＋</span><div class="group blue" style="font-size:40px">？</div><span class="operator">＝ ${q.total}</span>`;case'ten':return `<div class="tenframe">${Array.from({length:10},(_,i)=>`<i class="${i<q.a?'filled':''}"></i>`).join('')}</div>`;case'draw':return `<div><div class="group" id="drawA">先畫 ${q.a} 個圈</div><button data-act="drawA">＋ 加一個圈</button></div><span class="operator">＋</span><div><div class="group blue" id="drawB">先畫 ${q.b} 個圈</div><button data-act="drawB">＋ 加一個圈</button></div>`;case'line':return `<div style="width:100%"><p id="jumpText">${q.id==='counton'?`已跳 0 / ${q.b} 步`:'點選下面的數字'}</p><div class="numberline">${Array.from({length:limit()+1},(_,i)=>`<button data-line="${i}" class="${i===q.a?'active':''}" aria-label="數字${i}${i===q.a?'，起點':''}">${i===q.a?'🐸<br>':''}${i}</button>`).join('')}</div>${q.id==='counton'?'<button class="primary" data-act="jump">🐸 向前跳一步</button>':''}</div>`;case'take':return dots(q.a,'🍪');default:return ''}}
function formula(){if(['count','build','compare','sequence','symbols','sentence','split'].includes(q.id))return '';if(['take','sub'].includes(q.id))return `${q.a} − ${q.b} ＝ ？`;if(['bond','missing','ten'].includes(q.id))return `${q.a} ＋ □ ＝ ${q.total}`;return `${q.a} ＋ ${q.b} ＝ ？`}
function choices(){if(q.id==='compare')return ['左邊','右邊'];if(q.id==='symbols')return shuffle(['＋','−','＝']);if(q.id==='sentence')return shuffle([q.ans,`${q.a}−${q.b}＝${q.total}`,`${q.a}＋${q.b}＝${q.total+1}`]).slice(0,+settings.choices);let set=new Set([q.ans]);while(set.size<+settings.choices)set.add(rand(0,limit()));return shuffle([...set])}
function renderQuestion(){const opts=choices();if(q.id==='sentence'&&!opts.includes(q.ans))opts[0]=q.ans;app.innerHTML=`<div class="play-head"><button id="back">← 遊戲花園</button><h2>${active[1]} ${active[2]}</h2><span class="badge">階段 ${stage} · 第 ${index+1} / ${settings.rounds} 題</span></div><div class="progress"><span style="width:${index/settings.rounds*100}%"></span></div><section class="board"><button id="read" class="subtle">♫ 聽題目</button><h1 class="instruction">${q.prompt}</h1><div class="visual">${visual()}</div>${formula()?`<div class="math">${formula()}</div>`:''}<div class="answers">${q.mode==='build'?'<button class="primary answer" id="checkBuild">放好了 ✓</button>':q.mode==='line'?'':opts.map((a,i)=>`<button class="answer" data-answer="${i}" style="${q.id==='sentence'?'font-size:23px;letter-spacing:1px':''}">${a}</button>`).join('')}</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="hintArea"></div><div class="controls"><button id="hint">☀ 給我提示</button><button class="primary" id="next" hidden>下一題 →</button></div></section>`;$('#back').onclick=home;$('#read').onclick=()=>{sound=true;$('#sound').textContent='♫ 語音開';speak(q.prompt)};$('#hint').onclick=hint;$('#next').onclick=()=>{index++;next()};app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(opts[+b.dataset.answer]));if($('#checkBuild'))$('#checkBuild').onclick=()=>answer(work);app.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.dot;if(q.id==='take'){if(marks.has(i)){marks.delete(i);b.classList.remove('removed')}else if(marks.size<q.b){marks.add(i);b.classList.add('removed')}speak(`拿走了${marks.size}塊`)}else{marks.has(i)?marks.delete(i):marks.add(i);b.classList.toggle('marked');speak(String(marks.size))}});app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));app.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{if(q.mode==='line')answer(+b.dataset.line)})}
function act(action){if(done)return;if(action==='plus'||action==='minus'){work=Math.max(0,Math.min(limit(),work+(action==='plus'?1:-1)));$('#workArea').innerHTML='🥕'.repeat(work)||'籃子是空的';$('#workNum').textContent=work;speak(String(work))}if(action==='drawA'||action==='drawB'){const target=action==='drawA'?q.a:q.b;if(q[action]<target)q[action]++;$('#'+action).innerHTML=Array.from({length:q[action]},()=>'<span class="counter">🟠</span>').join('');speak(String(q[action]))}if(action==='jump'&&step<q.b){step++;$('#jumpText').textContent=`已跳 ${step} / ${q.b} 步 · 現在是 ${q.a+step}`;app.querySelectorAll('[data-line]').forEach(b=>b.classList.toggle('active',+b.dataset.line===q.a+step));app.querySelector(`[data-line="${q.a+step}"]`).scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});speak(String(q.a+step));if(step===q.b)app.querySelector('[data-act="jump"]').disabled=true}}
function answer(value){if(done)return;if(q.id==='draw'&&(q.drawA!==q.a||q.drawB!==q.b)){feedback('先按算式畫好兩邊的圈圈。',false);return}if(q.id==='take'&&marks.size!==q.b){feedback(`先點走 ${q.b} 塊餅乾，再數一數。`,false);return}if(q.id==='counton'&&step<q.b){feedback('先按「向前跳一步」，一起順數。',false);return}if(value===q.ans){done=true;if(!hadError&&!usedHelp)first++;if(usedHelp)helped++;feedback('答對了！你做到了 🌼',true);$('#next').hidden=false;$('#next').textContent=index+1===+settings.rounds?'看看我的小成就 →':'下一題 →';app.querySelectorAll('[data-answer], [data-line], #checkBuild').forEach(b=>b.disabled=true);speak('答對了，你做到了')}else{if(!hadError)mistakes++;hadError=true;feedback('再試一次。可以按「給我提示」一起數。',false);speak('再試一次，一起慢慢數')}}
function feedback(t,good){$('#feedback').textContent=t;$('#feedback').className='feedback '+(good?'good':'try')}
function hint(){usedHelp=true;let text='';switch(q.id){case'count':text='從左到右，每個蘋果只數一次。點過的蘋果會有記號。';break;case'build':text=`每按一次放入一根。目標是 ${q.n} 根，可以拿走再調整。`;break;case'compare':text=`左邊有 ${q.a} 條，右邊有 ${q.b} 條。哪個數比較大？`;break;case'sequence':text=`由 ${q.a} 開始，下一個數加 1，再到 ${q.a+2}。`;break;case'take':case'sub':text=`從 ${q.a} 個開始，拿走 ${q.b} 個。${q.id==='sub'?staticDots(q.total,'🍪'):''}數數剩下的餅乾。`;break;case'ten':text=`空着的格子就是要補上的數量。從 ${q.a} 數到 10。`;break;case'bond':case'missing':case'split':text=`全部有 ${q.total}，已知一邊有 ${q.a}。看看另一邊：${staticDots(q.b,'🟠','blue')}`;break;case'symbols':text='「＋」表示合起來；「＝」表示兩邊一樣多。';break;case'sentence':text=`先有 ${q.a}，再加 ${q.b}。找出「第一群 ＋ 第二群 ＝ 全部」的算式。`;break;case'counton':case'line':text=`把 ${q.a} 放在心裏，往前數 ${q.b} 次：${Array.from({length:q.b},(_,i)=>q.a+i+1).join('、')}。`;break;default:text=`把兩群合在一起，一個一個數。${staticDots(q.a,'🟠')}${staticDots(q.b,'🔵','blue')}`;}$('#hintArea').innerHTML=`<div class="hint">${text}</div>`}
function finish(){const rec={game:active[2],stage,rounds:+settings.rounds,first,helped,retry:mistakes,date:new Date().toLocaleString('zh-HK')};records.unshift(rec);records=records.slice(0,40);save();app.innerHTML=`<section class="board results"><div class="flowers">🌷 🌼 🌷</div><p class="eyebrow">WELL DONE, LITTLE GARDENER</p><h1>今天的小花開了！</h1><p class="instruction">你完成了 ${settings.rounds} 題練習。</p><p>自行首次答對 ${first} 題 · 用過提示 ${helped} 題 · 曾重試 ${mistakes} 題</p><p class="subtle">願意再試，也是很棒的進步。<br>練習紀錄只保留在這部裝置的瀏覽器。</p><div class="controls"><button id="again" class="primary">再玩一次 ↻</button><button id="returnHome">選另一個遊戲</button></div></section>`;$('#again').onclick=()=>start(active[0]);$('#returnHome').onclick=home;speak('你完成了練習，小花開了')}
function openModal(html){modal.innerHTML=`<button class="close" aria-label="關閉">✕</button>${html}`;modal.querySelector('.close').onclick=()=>modal.close();modal.showModal()}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♫ 語音開':'♫ 語音關';if(sound)speak('歡迎來到數學小花園')};
$('#teacher').onclick=()=>{openModal(`<h2>⚙ 教師設定</h2><p class="subtle">按學生需要調整。設定只保留於這部裝置。學生進入網站後，可選擇相應階段。</p><label class="setting-row">每次題數<select id="rounds">${[3,5,10].map(n=>`<option ${+settings.rounds===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="setting-row">答案選項<select id="choices"><option value="2" ${+settings.choices===2?'selected':''}>2 個選項</option><option value="3" ${+settings.choices===3?'selected':''}>3 個選項</option></select></label><label class="setting-row">數字範圍<select id="range">${[[0,'依階段（10／18）'],[5,'5 以內'],[10,'10 以內'],[18,'18 以內']].map(([n,t])=>`<option value="${n}" ${+settings.range===n?'selected':''}>${t}</option>`).join('')}</select></label><label class="setting-row">開啟延伸減法<input id="extension" type="checkbox" ${settings.extension?'checked':''} style="width:25px;height:25px"></label><p class="subtle">十格板固定練習湊成10。數感暖身及順數策略為支援活動；減法為額外延伸。粵語朗讀使用裝置提供的語音，部分 iPad 可能使用其他中文語音。</p><button id="saveSettings" class="primary">儲存設定</button><h3>這部裝置的最近練習</h3>${records.length?records.slice(0,10).map(r=>`<div class="record">${r.game} · 階段${r.stage} · ${r.rounds}題<br>首次自行答對 ${r.first} · 提示 ${r.helped} · 重試 ${r.retry}<br><span class="subtle">${r.date}</span></div>`).join(''):'<p class="subtle">完成一輪遊戲後，會顯示紀錄。</p>'}<p class="subtle">共用 iPad 的紀錄不能分辨學生；教師可用作即時觀察參考。</p><button id="clearRecords">清除本機紀錄</button>`);$('#saveSettings').onclick=()=>{settings.rounds=+$('#rounds').value;settings.choices=+$('#choices').value;settings.range=+$('#range').value;settings.extension=$('#extension').checked;save();modal.close();home()};$('#clearRecords').onclick=()=>{records=[];save();modal.close()}};

const fingerPage = "\u003c!doctype html>\n\u003chtml lang=\"zh-Hant-HK\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>手指向前數｜數學小花園\u003c/title>\n\u003cstyle>\n:root{color-scheme:light;--ink:#18362c;--leaf:#245e49;--mint:#e6f2e8;--paper:#f6f8ef;--edge:#cadacd}\n*{box-sizing:border-box}body{margin:0;font-family:system-ui,\"PingFang HK\",\"Microsoft JhengHei\",sans-serif;background:var(--paper);color:var(--ink)}\nheader,main,footer{max-width:920px;margin:auto;padding:18px clamp(12px,4vw,28px)}\nheader{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\na{color:var(--leaf);font-weight:700}button{font:inherit;font-weight:750;min-height:48px;touch-action:manipulation;cursor:pointer;color:var(--ink);background:#fff;border:2px solid var(--edge);border-radius:14px;padding:9px 16px}\nbutton[aria-pressed=true],.primary{background:var(--leaf);color:white;border-color:var(--leaf)}button:focus-visible,a:focus-visible{outline:4px solid #ad6800;outline-offset:3px}button:disabled{cursor:default}\nh1{margin:0;font-size:clamp(25px,5vw,42px)}h2{margin:0 0 12px}p{line-height:1.55}main{padding-top:4px}\n.toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.cluster{display:flex;gap:6px;flex-wrap:wrap}.cluster button{padding:8px 11px}\n.board{background:white;border:1px solid var(--edge);border-radius:24px;text-align:center;padding:clamp(12px,3vw,26px)}\n.progress{font-size:14px;color:#456858;font-weight:750}.equation{font-size:clamp(40px,9vw,72px);font-weight:850;margin:0;line-height:1.25;font-variant-numeric:tabular-nums}\n.instruction{font-size:clamp(18px,4vw,25px);font-weight:750;margin:10px 0 0}.count{display:inline-flex;gap:8px;align-items:baseline;justify-content:center;background:var(--mint);border-radius:12px;padding:6px 14px;margin:12px 0;font-size:18px}.count strong{font-size:clamp(26px,6vw,40px)}\n.hands{display:flex;gap:clamp(8px,3vw,24px);justify-content:center;flex-wrap:wrap;margin:6px 0}.hand{display:flex;align-items:end;justify-content:center;gap:3px;padding:5px 5px 0}.palm{height:15px;border-radius:0 0 26px 26px;background:#f5cc9b;margin:0 5px 5px}\n.finger{width:clamp(44px,9vw,66px);height:77px;border-radius:24px 24px 7px 7px;background:#ffe0b6;border:2px solid #946038;padding:4px;font-size:25px;color:#673e25}.finger:nth-child(3){height:94px}.finger:nth-child(4){height:87px}.finger:nth-child(2){height:84px}\n.finger:disabled{height:49px;background:#e3eee5;border-color:#7c9b87;color:#315b46;border-radius:12px;font-size:22px}\n.choices,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.choice{min-width:80px;min-height:65px;font-size:29px}\n.feedback{min-height:28px;margin:6px 0;font-size:18px;font-weight:750;color:#875016}.feedback.good{color:var(--leaf)}.steps{color:#456858;font-size:16px;margin:3px 0}footer{font-size:14px;color:#456858}\ndialog{max-width:min(92vw,520px);padding:22px;border:1px solid var(--edge);border-radius:20px;color:var(--ink)}dialog::backdrop{background:#18362c77}dialog img{display:block;width:min(210px,70vw);margin:auto}\n[hidden]{display:none!important}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain>\n\u003ch1>手指向前數\u003c/h1>\n\u003cdiv class=\"toolbar\">\n\u003cdiv class=\"cluster\" aria-label=\"選擇階段\">\u003cbutton id=\"stage1\" aria-pressed=\"true\">階段 1\u003c/button>\u003cbutton id=\"stage2\" aria-pressed=\"false\">階段 2\u003c/button>\u003c/div>\n\u003cdiv class=\"cluster\" aria-label=\"選擇模式\">\u003cbutton id=\"guided\" aria-pressed=\"true\">練習\u003c/button>\u003cbutton id=\"challenge\" aria-pressed=\"false\">挑戰\u003c/button>\u003c/div>\n\u003c/div>\n\u003csection class=\"board\" aria-label=\"手指加法\">\n\u003cdiv id=\"progress\" class=\"progress\">\u003c/div>\n\u003cp class=\"equation\" id=\"equation\">\u003c/p>\n\u003cp class=\"instruction\" id=\"instruction\">\u003c/p>\n\u003cp class=\"count\" id=\"count\" aria-live=\"polite\">\u003c/p>\n\u003cdiv id=\"hands\" class=\"hands\">\u003c/div>\n\u003cp class=\"steps\" id=\"steps\">\u003c/p>\n\u003cdiv id=\"choices\" class=\"choices\" hidden aria-label=\"答案選項\">\u003c/div>\n\u003cp id=\"feedback\" class=\"feedback\" role=\"status\">\u003c/p>\n\u003cdiv class=\"actions\">\n\u003cbutton id=\"hint\" hidden>看提示\u003c/button>\n\u003cbutton id=\"reset\">重數這題\u003c/button>\n\u003cbutton id=\"next\" class=\"primary\" hidden>下一題 →\u003c/button>\n\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cfooter>每輪 5 題 · 不設倒數 · 不用輸入姓名\u003c/footer>\n\n\u003cscript>\nconst el = id => document.getElementById(id);\nconst exercises = {\n  1: [[5,2],[6,3],[7,1],[4,4],[8,2]],\n  2: [[13,4],[14,6],[15,6],[16,3],[17,5]]\n};\nlet stage = __START_STAGE__;\nlet guided = true;\nlet question = 0;\nlet counted = 0;\nlet solved = false;\nlet completed = false;\n\nfunction questionData() {\n  return exercises[stage][question];\n}\n\nfunction showFeedback(message, good = false) {\n  el('feedback').textContent = message;\n  el('feedback').classList.toggle('good', good);\n}\n\nfunction showCount() {\n  const [first, second] = questionData();\n  el('count').innerHTML = counted === 0\n    ? '心裏的數 \u003cstrong>' + first + '\u003c/strong>'\n    : guided\n      ? '數到 \u003cstrong>' + (first + counted) + '\u003c/strong>'\n      : '已收起 \u003cstrong>' + counted + ' / ' + second + '\u003c/strong> 隻';\n  el('steps').textContent = counted === second\n    ? '手指數完了。想一想，最後數到哪個數？'\n    : '每點一隻手指，就說出下一個數。';\n}\n\nfunction renderHands(second) {\n  el('hands').replaceChildren();\n  for (let start = 0; start \u003c second; start += 5) {\n    const group = document.createElement('div');\n    const row = document.createElement('div');\n    const palm = document.createElement('div');\n    row.className = 'hand';\n    palm.className = 'palm';\n    palm.setAttribute('aria-hidden', 'true');\n    for (let i = start; i \u003c Math.min(start + 5, second); i++) {\n      const button = document.createElement('button');\n      button.className = 'finger';\n      button.textContent = '•';\n      button.setAttribute('aria-label', '收起第 ' + (i + 1) + ' 隻手指');\n      button.onclick = () => {\n        button.disabled = true;\n        button.textContent = '✓';\n        counted++;\n        showCount();\n        if (counted === second) el('choices').hidden = false;\n      };\n      row.append(button);\n    }\n    group.append(row, palm);\n    el('hands').append(group);\n  }\n}\n\nfunction showQuestion() {\n  const [first, second] = questionData();\n  counted = 0;\n  solved = false;\n  completed = false;\n  const total = first + second;\n  el('progress').textContent = '階段 ' + stage + ' · 第 ' + (question + 1) + ' / 5 題';\n  el('equation').textContent = first + ' ＋ ' + second + ' ＝ ？';\n  el('instruction').textContent = first + ' 放在心裏。伸出 ' + second + ' 隻手指。';\n  showCount();\n  renderHands(second);\n  el('choices').replaceChildren();\n  const alternatives = [total - 1, total, total + 1];\n  if (stage === 1) alternatives.splice(2);\n  const rotation = question % alternatives.length;\n  const answers = alternatives.slice(rotation).concat(alternatives.slice(0, rotation));\n  for (const value of answers) {\n    const button = document.createElement('button');\n    button.className = 'choice';\n    button.textContent = value;\n    button.onclick = () => {\n      if (value !== total) {\n        showFeedback('再想一想。最後一隻手指數到多少？');\n        el('hint').hidden = false;\n        return;\n      }\n      solved = true;\n      el('equation').textContent = first + ' ＋ ' + second + ' ＝ ' + total;\n      showFeedback('答對了！最後數到 ' + total + '。', true);\n      for (const option of el('choices').children) option.disabled = true;\n      el('next').hidden = false;\n      el('next').textContent = question === 4 ? '完成 →' : '下一題 →';\n      el('hint').hidden = true;\n    };\n    el('choices').append(button);\n  }\n  el('choices').hidden = true;\n  el('next').hidden = true;\n  el('reset').hidden = false;\n  el('hint').hidden = guided;\n  showFeedback('');\n}\n\nfunction restart() {\n  question = 0;\n  el('stage1').setAttribute('aria-pressed', stage === 1);\n  el('stage2').setAttribute('aria-pressed', stage === 2);\n  el('guided').setAttribute('aria-pressed', guided);\n  el('challenge').setAttribute('aria-pressed', !guided);\n  showQuestion();\n}\n\nel('stage1').onclick = () => { if (stage !== 1) { stage = 1; restart(); } };\nel('stage2').onclick = () => { if (stage !== 2) { stage = 2; restart(); } };\nel('guided').onclick = () => { if (!guided) { guided = true; restart(); } };\nel('challenge').onclick = () => { if (guided) { guided = false; restart(); } };\nel('reset').onclick = showQuestion;\nel('hint').onclick = () => {\n  const [first] = questionData();\n  showFeedback('心裏是 ' + first + '。第一隻手指由 ' + (first + 1) + ' 開始數。');\n};\nel('next').onclick = () => {\n  if (completed) { restart(); return; }\n  if (!solved) return;\n  if (question \u003c 4) {\n    question++;\n    showQuestion();\n    return;\n  }\n  completed = true;\n  el('progress').textContent = '完成 5 題';\n  el('equation').textContent = '做得好！';\n  el('instruction').textContent = '試用自己的手指，再做一道新題。';\n  el('count').textContent = '心裏的數 → 下一個數';\n  el('steps').textContent = '';\n  el('hands').replaceChildren();\n  el('choices').hidden = true;\n  el('reset').hidden = true;\n  el('hint').hidden = true;\n  el('next').textContent = '再玩一次';\n  showFeedback('');\n};\nrestart();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const fingerFrame = document.getElementById('finger-frame');
let fingerSizeObserver;

fingerFrame.addEventListener('load', () => {
  fingerSizeObserver?.disconnect();
  const body = fingerFrame.contentDocument?.body;
  if (!body) return;
  const fit = () => {
    if (!fingerFrame.closest('[hidden]')) {
      fingerFrame.style.height = Math.max(body.scrollHeight, 500) + 'px';
    }
  };
  fit();
  if ('ResizeObserver' in window) {
    fingerSizeObserver = new ResizeObserver(fit);
    fingerSizeObserver.observe(body);
  }
});

function showActivity() {
  const isFinger = location.hash === '#fingers';
  document.getElementById('garden-view').hidden = isFinger;
  document.getElementById('finger-view').hidden = !isFinger;
  document.getElementById('teacher').hidden = isFinger;
  document.getElementById('sound').hidden = isFinger;
  if (isFinger) {
    fingerFrame.srcdoc = fingerPage.replace('__START_STAGE__', String(stage));
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', showActivity);
showActivity();
